[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "atomx-codex"
version = "0.1.1"
description = "A keyboard-first terminal workspace for local Codex sessions"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["textual==6.12.0", "Pillow==12.3.0", "websockets==15.0.1", "textual-image==0.12.0"]

[project.urls]
Repository = "https://github.com/Archaic-Atom/atomx"
Issues = "https://github.com/Archaic-Atom/atomx/issues"
Changelog = "https://github.com/Archaic-Atom/atomx/blob/master/CHANGELOG.md"

[project.scripts]
atomx = "arcatom_codex.__main__:main"

[tool.setuptools.package-data]
arcatom_codex = ["*.tcss", "assets/*.png", "locales/*.json"]

[tool.setuptools.packages.find]
include = ["arcatom_codex*"]

[tool.ruff]
line-length = 80
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "D100", "D101", "D102", "D103", "D104", "D107", "ANN"]
ignore = ["ANN401"] # JSON RPC payloads have server-defined values.

[tool.ruff.lint.pycodestyle]
max-line-length = 100

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.11"
files = ["arcatom_codex"]
check_untyped_defs = true
disallow_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
ignore_missing_imports = true
